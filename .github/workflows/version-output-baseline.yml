name: version-output baseline (fork only)
on:
  push:
    branches: [qualification/fastmcp-version-output-baseline]
permissions:
  contents: read
jobs:
  baseline:
    if: github.repository == 'rudycelekli/nanobot' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: PrefectHQ/fastmcp
          ref: e2fcc412001ff7414095c5dc282f94c70299a612
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: '3.13'
          enable-cache: false
      - name: unchanged native public API baseline
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python harness/.qualification/fastmcp-version-output-baseline/native.py source proof
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: version-output-baseline-${{ github.run_id }}
          path: proof
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
